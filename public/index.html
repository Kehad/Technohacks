<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>

      <div class="add-task">
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button id="addButton">Add</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <!-- Modal Structure -->
      <div id="editModal" class="modal">
        <div class="modal-content">
          <h4>Edit Task</h4>
          <input type="text" id="editTaskInput" />
          <div class="modal-footer">
            <button id="saveEditButton" class="modal-close btn">Save</button>
            <button id="cancelEditButton" class="modal-close btn">Cancel</button>
          </div>
        </div>
      </div>
      <ul id="tasksList">
        <!-- Tasks will be inserted here dynamically -->
        <!-- <li class="task-item">
          <input type="checkbox" class="task-checkbox" />
          <span class="task-text completed">hEY</span>
          <button class="task-edit">✎</button>
          <button class="task-delete">X</button>
          <i class="material-icons" style="font-size: 36px">delete</i>
        </li> -->
      </ul>

      <div class="task-count"><span id="taskCount">0</span> tasks left</div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
